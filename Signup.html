<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Coding Websites</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        /* Internal CSS for the Create Account Page */
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* Prevent scroll for the background elements */
        }
        .bg-gradient-custom {
            background: linear-gradient(135deg, #6A5ACD, #483D8B); /* Deeper purple gradient */
        }
        /* Custom styles for abstract shapes */
        .shape-sphere {
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            filter: blur(20px);
        }
        .shape-cylinder {
            background-color: rgba(255, 255, 255, 0.15);
            border-radius: 9999px; /* Pill shape */
            filter: blur(15px);
        }
        /* Message box styling */
        .message-box {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            display: none; /* Hidden by default */
        }
        .social-separator {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0 14px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.75rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }
        .social-separator::before,
        .social-separator::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.25);
        }
        .google-auth-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            background: #ffffff;
            color: #202124;
            border: 1px solid rgba(0, 0, 0, 0.14);
            border-radius: 0.625rem;
            padding: 0.72rem 1rem;
            font-weight: 700;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.16);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
        }
        .google-auth-btn:hover {
            background: #f8f9fa;
            transform: translateY(-1px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.2);
        }
        .google-auth-btn:focus-visible {
            outline: 3px solid rgba(255, 255, 255, 0.5);
            outline-offset: 2px;
        }
        .google-auth-btn svg {
            width: 1.2rem;
            height: 1.2rem;
            flex-shrink: 0;
        }
    </style>
</head>
<body class="bg-gradient-custom text-white min-h-screen flex flex-col items-center justify-center relative">

    <!-- Abstract Shapes (copied for consistency) -->
    <div class="absolute top-1/4 left-1/4 w-40 h-40 shape-sphere transform -translate-x-1/2 -translate-y-1/2"></div>
    <div class="absolute top-1/2 right-1/4 w-32 h-32 shape-sphere transform translate-x-1/2 -translate-y-1/2"></div>
    <div class="absolute bottom-1/4 left-1/3 w-20 h-20 shape-sphere transform -translate-x-1/2 translate-y-1/2"></div>

    <div class="absolute top-1/3 left-0 w-80 h-16 shape-cylinder transform -rotate-45 -translate-x-1/2"></div>
    <div class="absolute bottom-1/3 right-0 w-60 h-12 shape-cylinder transform rotate-45 translate-x-1/2"></div>
    <!-- Navigation Bar -->
    <nav class="p-6 flex justify-end z-10">
        <div class="flex space-x-6">
            <a href="CodingWindow.html" class="text-white hover:text-gray-300 transition-colors duration-200">Home</a>
            <a href="Get started-1.html" class="text-white hover:text-gray-300 transition-colors duration-200">Get Started</a>
            <a href="Sign in-1.html" class="text-white hover:text-gray-300 transition-colors duration-200">Sign In</a>
            <a href="Signup.html" class="text-white hover:text-gray-300 transition-colors duration-200">Sign Up</a>
            <a href="loginthroughsocial.html" class="text-white hover:text-gray-300 transition-colors duration-200">Social Login</a>
        </div>
    </nav>

    <!-- Create Account Form Container -->
    <div class="bg-white bg-opacity-10 p-8 rounded-xl shadow-lg max-w-md w-full mx-4 relative z-10 backdrop-filter backdrop-blur-sm border border-opacity-20 border-white">
        <h2 class="text-3xl font-bold text-center mb-6">Create Account</h2>
        <form id="createAccountForm" class="space-y-4">
            <div>
                <label for="username" class="block text-sm font-medium text-white mb-1">Username</label>
                <input type="text" id="username" name="username" class="w-full px-4 py-2 rounded-md bg-white bg-opacity-20 border border-white border-opacity-30 focus:outline-none focus:ring-2 focus:ring-white focus:ring-opacity-50 text-white placeholder-gray-300" placeholder="Choose a username" required>
            </div>
            <div>
                <label for="email" class="block text-sm font-medium text-white mb-1">Email</label>
                <input type="email" id="email" name="email" class="w-full px-4 py-2 rounded-md bg-white bg-opacity-20 border border-white border-opacity-30 focus:outline-none focus:ring-2 focus:ring-white focus:ring-opacity-50 text-white placeholder-gray-300" placeholder="your@example.com" required>
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-white mb-1">Password</label>
                <input type="password" id="password" name="password" class="w-full px-4 py-2 rounded-md bg-white bg-opacity-20 border border-white border-opacity-30 focus:outline-none focus:ring-2 focus:ring-white focus:ring-opacity-50 text-white placeholder-gray-300" placeholder="••••••••" required>
            </div>
            <div>
                <label for="confirmPassword" class="block text-sm font-medium text-white mb-1">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" class="w-full px-4 py-2 rounded-md bg-white bg-opacity-20 border border-white border-opacity-30 focus:outline-none focus:ring-2 focus:ring-white focus:ring-opacity-50 text-white placeholder-gray-300" placeholder="••••••••" required>
            </div>
            <button type="submit" class="w-full bg-white text-purple-700 font-semibold py-2 rounded-md hover:bg-gray-100 transition-all duration-300 shadow-md">
                Create Account
            </button>
        </form>
        <p class="social-separator">or continue with</p>
        <button type="button" id="google-login-btn" class="google-auth-btn">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path fill="#4285F4" d="M23.49 12.27c0-.77-.07-1.5-.2-2.2H12v4.17h6.46a5.53 5.53 0 0 1-2.4 3.64v3h3.88c2.27-2.1 3.55-5.18 3.55-8.61Z"/>
                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.07 7.93-2.91l-3.88-3a7.2 7.2 0 0 1-10.7-3.78H1.35v3.1A12 12 0 0 0 12 24Z"/>
                <path fill="#FBBC05" d="M5.35 14.31a7.2 7.2 0 0 1 0-4.62v-3.1H1.35a12.03 12.03 0 0 0 0 10.82l4-3.1Z"/>
                <path fill="#EA4335" d="M12 4.77c1.76 0 3.33.6 4.57 1.8l3.42-3.42A11.4 11.4 0 0 0 12 0 12 12 0 0 0 1.35 6.59l4 3.1A7.15 7.15 0 0 1 12 4.77Z"/>
            </svg>
            Continue with Google
        </button>
        <p class="text-center text-sm mt-4">
            Already have an account? <a href="Sign in-1.html" class="text-white hover:underline font-medium">Sign In</a>
            <a href="loginthroughsocial.html" class="text-white hover:underline font-medium block mt-2">Login Here</a>
        </p>
    </div>

    <!-- Message Box -->
    <div id="messageBox" class="message-box"></div>

    <script type="module">
        import { oauthLogin, handleAuthCallback, AuthError } from 'https://esm.sh/@netlify/identity';

        async function processAuthCallback() {
            try {
                const result = await handleAuthCallback();
                if (!result) return;
                if (result.type === 'oauth') {
                    showMessage('Google sign in completed successfully.');
                    return;
                }
                showMessage('Authentication flow completed.');
            } catch (error) {
                if (error instanceof AuthError) {
                    showMessage(error.message || 'Google authentication failed.');
                    return;
                }
                showMessage('Unable to complete Google authentication.');
            }
        }

        processAuthCallback();

        document.getElementById('google-login-btn').addEventListener('click', () => {
            oauthLogin('google');
        });

        // JavaScript for the Create Account Page
        document.getElementById('createAccountForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Prevent default form submission

            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!username || !email || !password || !confirmPassword) {
                showMessage('Please fill in all fields.');
                return;
            }

            if (password !== confirmPassword) {
                showMessage('Passwords do not match.');
                return;
            }

            
            showMessage('Account created successfully! (Simulated)');
            console.log('Attempted account creation with:', { username, email, password });
        });

        function showMessage(message, duration = 3000) {
            const messageBox = document.getElementById('messageBox');
            messageBox.textContent = message;
            messageBox.style.display = 'block';

            // Hide the message after a certain duration
            setTimeout(() => {
                messageBox.style.display = 'none';
            }, duration);
        }
    </script>
</body>

</html>
